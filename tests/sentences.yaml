# Test sentences (dev set, v0) - written BEFORE any model run
#
# How scoring will work:
#  - model check: every expected op must be in Gemma's answer (order does not matter,
#    names compared ignoring case). Extra `person` ops are fine; any other extra op is an error.
#  - code check: after the ops, the code must do what `expect_code` says
#    (save / ask which person / reject with a reason).
#
# The tree is loaded from data/villa-diodati.yaml before each Villa Diodati test,
# and starts empty before each Rossi test.

dev:

  - id: d01
    tree: empty
    sentence: "Mary Shelley was the daughter of William Godwin and Mary Wollstonecraft."
    expected_ops:
      - { op: child, child: Mary Shelley, parents: [William Godwin, Mary Wollstonecraft], relation: birth }
    expect_code: save

  - id: d02
    tree: empty
    sentence: "William Godwin married Mary Wollstonecraft at St Pancras Church in March 1797."
    expected_ops:
      - { op: union, partners: [William Godwin, Mary Wollstonecraft], type: marriage }
      - { op: event, partners: [William Godwin, Mary Wollstonecraft], type: marriage, date: March 1797, place: St Pancras Church }
    expect_code: save

  - id: d03
    tree: empty
    sentence: "Mary Wollstonecraft died in London in September 1797, a few days after giving birth."
    expected_ops:
      - { op: event, person: Mary Wollstonecraft, type: death, date: September 1797, place: London }
    expect_code: save

  - id: d04
    tree: villa-diodati
    sentence: "Fanny Imlay was Mary Shelley's half-sister on her mother's side."
    expected_ops:
      - { op: siblings, people: [Fanny Imlay, Mary Shelley], kind: half, shared_parent: mother }
    expect_code: save   # already consistent with the tree: nothing new to add, and no error

  - id: d05
    tree: empty
    sentence: "Claire Clairmont was Mary Shelley's stepsister."
    expected_ops:
      - { op: siblings, people: [Claire Clairmont, Mary Shelley], kind: step }
    expect_code: save

  - id: d06
    tree: empty
    sentence: "Byron and Annabella Milbanke married on 2 January 1815; their only child, Ada, was born in London on 10 December 1815."
    expected_ops:
      - { op: union, partners: [Byron, Annabella Milbanke], type: marriage }
      - { op: event, partners: [Byron, Annabella Milbanke], type: marriage, date: 2 January 1815 }
      - { op: child, child: Ada, parents: [Byron, Annabella Milbanke], relation: birth }
      - { op: event, person: Ada, type: birth, date: 10 December 1815, place: London }
    expect_code: save

  - id: d07
    tree: empty
    sentence: "Allegra was the daughter of Lord Byron and Claire Clairmont, who never married."
    expected_ops:
      - { op: union, partners: [Lord Byron, Claire Clairmont], type: partnership }
      - { op: child, child: Allegra, parents: [Lord Byron, Claire Clairmont], relation: birth }
    expect_code: save

  - id: d08
    tree: villa-diodati
    sentence: "Percy married Mary on 30 December 1816."
    expected_ops:
      - { op: union, partners: [Percy, Mary], type: marriage }
      - { op: event, partners: [Percy, Mary], type: marriage, date: 30 December 1816 }
    expect_code: ask_which   # two Percys and two Marys in the tree: the code must ask, never guess
    note: Gemma must copy "Percy" and "Mary" as written, not expand them to full names.

  - id: d09
    tree: villa-diodati
    sentence: "Percy Florence Shelley was William Godwin's grandson."
    expected_ops:
      - { op: relation_hint, a: Percy Florence Shelley, b: William Godwin, kind: grandchild }
    expect_code: save   # the tree already explains it through Mary Shelley

  - id: d10
    tree: villa-diodati
    sentence: "Villa Diodati is a mansion near Lake Geneva, rented by Byron in June 1816."
    expected_ops: []
    # Decided after runs 1-3: "rented by Byron" can fairly be read as Byron living there.
    # Then the app must ask which Byron: the tree has Lord Byron, Allegra Byron and Ada (born Byron).
    also_ok:
      - { op: event, person: Byron, type: residence, place: Villa Diodati }
    expect_code: [save, ask_which]

  - id: d11
    tree: villa-diodati
    sentence: "Ada Lovelace was Lord Byron's mother."
    expected_ops:
      - { op: child, child: Lord Byron, parents: [Ada Lovelace], relation: birth }
    expect_code: reject   # Ada is Byron's daughter: she would be her own grandmother
    note: Gemma must faithfully translate even a wrong sentence. Catching the mistake is the code's job.

  # --- Italian, fictional Rossi family (the real use case: parents dictating) ---

  - id: d12
    tree: empty
    sentence: "Maria Rossi è la moglie di Marco Rossi."
    expected_ops:
      - { op: union, partners: [Maria Rossi, Marco Rossi], type: marriage }
    expect_code: save

  - id: d13
    tree: empty
    sentence: "Marco e Roberta sono fratelli."
    expected_ops:
      - { op: siblings, people: [Marco, Roberta], kind: unspecified }
    expect_code: save
    note: 'The word "fratelli" does not say whether they share both parents.'

  - id: d14
    tree: empty
    sentence: "Roberta è nata a Padova nel 1960, poi si è trasferita a Parigi."
    expected_ops:
      - { op: event, person: Roberta, type: birth, date: "1960", place: Padova }
      - { op: event, person: Roberta, type: residence, place: Parigi }
    expect_code: save

  - id: d15
    tree: empty
    sentence: "Giuseppe è il figlio adottivo di Maria e Marco."
    expected_ops:
      - { op: child, child: Giuseppe, parents: [Maria, Marco], relation: adopted }
    expect_code: save

# Holdout set: written by Carla, without looking at any model output.
# Run ONCE at the end, after the prompt and the code are frozen (git tag).
# Suggested mix: at least 3 in Italian; one with an ambiguous name; one half- or
# step-relation; one sentence with no family facts; one with several facts at once;
# one that says something impossible.
holdout:
# Written by Carla in tests/holdout.txt before the engine existed, kept secret until the code was finished.
# Turned into this format on 29 Oct, BEFORE running any model on them, and committed before the run.
# Her words for each case are kept as `expected`; the ops are the closest thing the data model can store.

  - id: h01
    tree: empty
    sentence: "Nonna Lucia era la sorella di zio Pietro."
    expected: "Lucia e Pietro sono fratelli."
    # "Nonna" and "zio" are what the speaker calls them, not their names
    expected_ops:
      - { op: siblings, people: [Lucia, Pietro], kind: unspecified }
    expect_code: save

  - id: h02
    tree: empty
    sentence: "La Maria, quella che ha sposato il figlio di nonno Carlo, si chiama così anche lei."
    expected: "Maria è sposata con un figlio di Carlo; il nome del marito non è specificato. Non confondere questa Maria con altre persone omonime."
    # The tree can't hold a person without a name, so the unnamed husband can't be stored.
    # The most it can keep is that Maria is Carlo's in-law (daughter-in-law).
    expected_ops:
      - { op: relation_hint, a: Maria, b: Carlo, kind: in_law }
    expect_code: save

  - id: h03
    tree: empty
    sentence: "Ti ricordi Anna? Sua mamma era la zia Teresa, sorella di papà."
    expected: "Teresa è la madre di Anna ed è sorella del padre di chi parla; Anna è cugina di chi parla."
    # The tree has no "me" and "papà" has no name: the part that can be stored is Teresa as Anna's mother.
    # A person called "papà" would be wrong.
    expected_ops:
      - { op: child, child: Anna, parents: [Teresa], relation: birth }
    expect_code: save

  - id: h04
    tree: empty
    sentence: "Quando è nato Luigi, sua sorella Rosa aveva già cinque anni."
    expected: "Luigi e Rosa sono fratelli; Rosa è più grande di Luigi di circa cinque anni."
    # No year is given, so the five years can't become dates
    expected_ops:
      - { op: siblings, people: [Rosa, Luigi], kind: unspecified }
    expect_code: save

  - id: h05
    tree: villa-diodati
    sentence: "Mary Godwin, che poi diventò Mary Shelley, era la compagna di Percy Bysshe Shelley quando soggiornarono vicino a Villa Diodati nel 1816."
    expected: "Mary Godwin e Mary Shelley sono la stessa persona; Mary e Percy Bysshe Shelley erano una coppia. Non creare due persone distinte per Mary."
    expected_ops:
      - any_of:
          - { op: union, partners: [Mary Godwin, Percy Bysshe Shelley], type: partnership }
          - { op: union, partners: [Mary Shelley, Percy Bysshe Shelley], type: partnership }
    also_ok:
      - { op: event, person: Mary Godwin, type: residence }
      - { op: event, person: Mary Shelley, type: residence }
      - { op: event, partners: [Mary Godwin, Percy Bysshe Shelley], type: residence }
      - { op: event, partners: [Mary Shelley, Percy Bysshe Shelley], type: residence }
    # "Mary Godwin" also matches Mary Jane Godwin, so asking which Mary is right too; a new Mary is not
    expect_code: [save, ask_which]

  - id: h06
    tree: villa-diodati
    sentence: "William Godwin era il padre di Mary Godwin, mentre William Polidori era il padre di John William Polidori, presente a Villa Diodati."
    expected: "William Godwin è il padre di Mary Godwin; William Polidori è il padre di John William Polidori. I due William sono persone diverse e non vanno fusi; John William Polidori è una terza persona."
    expected_ops:
      - { op: child, child: Mary Godwin, parents: [William Godwin], relation: birth }
      - { op: child, child: John William Polidori, parents: [William Polidori], relation: birth }
    # "Mary Godwin" needs an answer (Mary Shelley or Mary Jane Godwin); William Polidori must not become John William Polidori
    expect_code: ask_which
